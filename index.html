<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>קטלוג מוצרים</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
      line-height: 1.3;
      height: 38px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .price-container {
      margin-bottom: 12px;
      font-size: 16px;
    }

    .old-price {
      text-decoration: line-through;
      color: #888;
      font-size: 13px;
      margin-left: 6px;
    }

    .current-price {
      color: #e62e04;
      font-weight: bold;
    }

    .buy-btn {
      display: block;
      text-align: center;
      background-color: #ff4747;
      color: #fff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .buy-btn:hover {
      background-color: #e03232;
    }
  </style>
</head>
<body>

  <div id="products-container" class="products-grid">
    <p>טוען מוצרים...</p>
  </div>

  <script>
    // הנתיב לקובץ ה-CSV ב-GitHub (חובה לקשר לגרסת Raw)
    const csvUrl = 'products.csv';

    async function loadProducts() {
      try {
        const response = await fetch(csvUrl);
        const text = await response.text();

        // פירוק שורות הקובץ
        const lines = text.trim().split('\n');
        if (lines.length <= 1) return;

        const container = document.getElementById('products-container');
        container.innerHTML = ''; // ניקוי הודעת הטעינה

        // דילוג על שורת הכותרת (i = 1)
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          // פירוק לפי נקודה-פסיק (התחשבות בערכים עם מירכאות)
          const cols = parseCsvLine(line, ';');

          const title = cols[1];
          const url = cols[2];
          const currency = cols[4] || '$';
          const image = cols[6];
          const oldPrice = cols[7];
          const price = cols[8];

          if (!title || !url) continue;

          // יצירת הכרטיסייה
          const card = document.createElement('div');
          card.className = 'product-card';

          const currencySymbol = currency === 'USD' ? '$' : currency;

          let priceHTML = '';
          if (oldPrice && parseFloat(oldPrice) > parseFloat(price)) {
            priceHTML = `<span class="old-price">${currencySymbol}${oldPrice}</span> `;
          }
          priceHTML += `<span class="current-price">${currencySymbol}${price}</span>`;

          card.innerHTML = `
            <img src="${image}" alt="${title}" loading="lazy">
            <div class="product-title" title="${title}">${title}</div>
            <div class="price-container">${priceHTML}</div>
            <a href="${url}" target="_blank" rel="nofollow" class="buy-btn">לצפייה במוצר</a>
          `;

          container.appendChild(card);
        }
      } catch (err) {
        console.error('שגיאה שטעינת הקובץ:', err);
        document.getElementById('products-container').innerHTML = '<p>אירעה שגיאה בטעינת המוצרים.</p>';
      }
    }

    // פונקציית עזר לניתוח שורת CSV לפי מפריד מותאם אישית
    function parseCsvLine(line, delimiter) {
      const values = [];
      let currentValue = '';
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === delimiter && !insideQuotes) {
          values.push(currentValue.replace(/^"|"$/g, '').trim());
          currentValue = '';
        } else {
          currentValue += char;
        }
      }
      values.push(currentValue.replace(/^"|"$/g, '').trim());
      return values;
    }

    // הפעלת הטעינה בזמן עליית הדף
    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>
