<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קטלוג מוצרים</title>
  
  <!-- אייקונים של FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .main-title {
      text-align: center;
      color: #222;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
      line-height: 1.3;
      height: 38px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .price-container {
      margin-bottom: 12px;
      font-size: 16px;
      text-align: center;
    }

    .old-price {
      text-decoration: line-through;
      color: #888;
      font-size: 13px;
      margin-left: 6px;
    }

    .current-price {
      color: #e62e04;
      font-weight: bold;
    }

    .buy-btn {
      display: block;
      text-align: center;
      background-color: #ff4747;
      color: #fff;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 4px;
      font-weight: bold;
      margin-bottom: 8px;
      transition: background-color 0.2s;
    }

    .buy-btn:hover {
      background-color: #e03232;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      background-color: #f9f9f9;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      color: #333;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background-color: #eee;
    }

    .btn-wa {
      color: #25D366;
    }
  </style>
</head>
<body>

  <h1 class="main-title">קטלוג מוצרים מומלצים</h1>

  <div id="products-container" class="products-grid">
    <p>טוען מוצרים ומתרגם...</p>
  </div>

  <script>
    const csvUrl = 'products.csv';

    // פונקציה לתרגום טקסט מאנגלית לעברית ברקע
    async function translateText(text) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=he&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        return data[0][0][0] || text;
      } catch (e) {
        return text; // במקרה של שגיאה יוחזר הטקסט המקורי
      }
    }

    async function loadProducts() {
      try {
        const response = await fetch(csvUrl);
        const text = await response.text();

        const lines = text.trim().split(/\r?\n/);
        if (lines.length <= 1) return;

        const headers = parseCsvLine(lines[0], ';').map(h => h.trim().toLowerCase());
        
        const titleIdx = headers.indexOf('title');
        const urlIdx = headers.indexOf('url');
        const imageIdx = headers.indexOf('image');
        const priceIdx = headers.indexOf('price');
        const oldPriceIdx = headers.indexOf('oldprice');
        const currencyIdx = headers.indexOf('currencyid');

        const container = document.getElementById('products-container');
        container.innerHTML = '';

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          const cols = parseCsvLine(line, ';');

          const rawTitle = cols[titleIdx];
          const url = cols[urlIdx];
          const image = cols[imageIdx];
          const price = cols[priceIdx];
          const oldPrice = oldPriceIdx !== -1 ? cols[oldPriceIdx] : '';
          const currency = currencyIdx !== -1 ? cols[currencyIdx] : '$';

          if (!rawTitle || !url || !image) continue;

          // תרגום הכותרת לעברית בצורה אוטומטית
          const translatedTitle = await translateText(rawTitle);

          const card = document.createElement('div');
          card.className = 'product-card';

          const currencySymbol = (currency === 'USD' || !currency) ? '$' : currency;

          let priceHTML = '';
          if (oldPrice && parseFloat(oldPrice) > parseFloat(price)) {
            priceHTML = `<span class="old-price">${currencySymbol}${oldPrice}</span> `;
          }
          if (price) {
            priceHTML += `<span class="current-price">${currencySymbol}${price}</span>`;
          }

          const waShareUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(translatedTitle + ' - ' + url)}`;

          card.innerHTML = `
            <img src="${image}" alt="${translatedTitle}" loading="lazy" referrerpolicy="no-referrer">
            <div class="product-title" title="${translatedTitle}">${translatedTitle}</div>
            <div class="price-container">${priceHTML}</div>
            <a href="${url}" target="_blank" rel="nofollow" class="buy-btn">לצפייה במוצר</a>
            
            <div class="action-buttons">
              <a href="${waShareUrl}" target="_blank" class="action-btn btn-wa" title="שתף ב-WhatsApp">
                <i class="fab fa-whatsapp"></i> שתף
              </a>
              <button class="action-btn" onclick="copyToClipboard('${url}')" title="העתק קישור">
                <i class="far fa-copy"></i> העתק
              </button>
            </div>
          `;

          container.appendChild(card);
        }
      } catch (err) {
        console.error('שגיאה בטעינת הקובץ:', err);
        document.getElementById('products-container').innerHTML = '<p>אירעה שגיאה בטעינת המוצרים.</p>';
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('הקישור הועתק בהצלחה!');
      });
    }

    function parseCsvLine(line, delimiter) {
      const values = [];
      let currentValue = '';
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === delimiter && !insideQuotes) {
          values.push(currentValue.replace(/^"|"$/g, '').trim());
          currentValue = '';
        } else {
          currentValue += char;
        }
      }
      values.push(currentValue.replace(/^"|"$/g, '').trim());
      return values;
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>
